    <!-- Mobile Toggle Button -->
    <button class="mobile-toggle" (click)="toggleSidenav()" *ngIf="isMobile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="mobile-overlay" *ngIf="isMobile && isOpen" (click)="toggleSidenav()"></div>
  </div>

  <div class="main-content-area">
    <header class="topnav">
      <div class="topnav-content">
        <div class="topnav-left">
          <h1 class="page-title">{{ pageTitle }}</h1>
        </div>
        <div class="topnav-right">
          <!-- Notifications -->
          <div class="notification-wrapper" (click)="toggleNotifications($event)">
            <button class="icon-button" [class.has-notifications]="unreadCount > 0">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M11.4417 17.4998C11.2952 17.7524 11.0849 17.962 10.8319 18.1078C10.5788 18.2535 10.292 18.3302 10 18.3302C9.70802 18.3302 9.42116 18.2535 9.16814 18.1078C8.91513 17.962 8.70484 17.7524 8.55833 17.4998M15 6.6665C15 5.34042 14.4732 4.06865 13.5355 3.13097C12.5979 2.19329 11.3261 1.6665 10 1.6665C8.67392 1.6665 7.40215 2.19329 6.46447 3.13097C5.52678 4.06865 5 5.34042 5 6.6665C5 12.4998 2.5 14.1665 2.5 14.1665H17.5C17.5 14.1665 15 12.4998 15 6.6665Z"
                  stroke="#667085" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
            </button>
          </div>

          <!-- Notifications Dropdown -->
          <div class="notification-dropdown" *ngIf="showNotifications" (click)="$event.stopPropagation()">
            <div class="dropdown-header">
              <h3>Notifications</h3>
              <button class="mark-read-btn" (click)="markAllAsRead()">Mark all as read</button>
            </div>
            <div class="notification-list">
              <div class="notification-item" *ngFor="let notification of notifications"
                [class.unread]="!notification.read" (click)="markAsRead(notification)">
                <div class="notification-icon" [class]="notification.type">
                  <svg *ngIf="notification.type === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                  </svg>
                  <svg *ngIf="notification.type === 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                    </path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                  </svg>
                  <svg *ngIf="notification.type === 'info'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                  </svg>
                </div>
                <div class="notification-content">
                  <p class="notification-title">{{ notification.title }}</p>
                  <p class="notification-message">{{ notification.message }}</p>
                  <span class="notification-time">{{ notification.time }}</span>
                </div>
              </div>
              <div class="no-notifications" *ngIf="notifications.length === 0">
                <p>No notifications</p>
              </div>
            </div>
            <div class="dropdown-footer">
              <button class="view-all-btn" (click)="viewAllNotifications()">View all notifications</button>
            </div>
          </div>
        </div>

        <div class="profile-wrapper" (click)="toggleProfile($event)">
          <button class="profile-button">
            <img [src]="userProfile.avatar" class="profile-avatar">
            <div class="profile-info">
              <span class="profile-name">{{ userProfile.name }}</span>
              <span class="profile-role">{{ userProfile.role }}</span>
            </div>
          </button>
          <div class="profile-dropdown" *ngIf="showProfile" (click)="$event.stopPropagation()">
            <div class="profile-header">
              <img [src]="userProfile.avatar" class="profile-avatar-large">
              <div class="profile-details">
                <h3>{{ userProfile.name }}</h3>
                <p>{{ userProfile.email }}</p>
              </div>
            </div>
            <div class="profile-menu">
              <button (click)="navigateTo('profile')" class="menu-item-profile">My Profile</button>
              <button (click)="navigateTo('settings')" class="menu-item-profile">Settings</button>
              <div class="menu-divider"></div>
              <button (click)="logout()" class="menu-item-profile logout-item">Logout</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="page-content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
