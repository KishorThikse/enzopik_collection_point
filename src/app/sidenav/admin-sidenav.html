<div class="admin-sidebar">
    <div class="sidebar-header">
        <div class="admin-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>ENZO ADMIN</span>
        </div>
    </div>

    <div class="user-profile-mini">
        <div class="avatar">{{ userName.charAt(0) }}</div>
        <div class="info">
            <p class="name">{{ userName }}</p>
            <p class="role">System Administrator</p>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-label">Administration</div>
        <a class="nav-item" [class.active]="activeRoute === 'dashboard'" (click)="navigateTo('admin-dashboard')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Admin Dashboard
        </a>

        <div class="nav-label">Security</div>
        <a class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            Access Logs
        </a>
    </nav>

    <div class="sidebar-footer">
        <button class="logout-btn" (click)="logout()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Sign Out
        </button>
    </div>
</div>

<div class="admin-main-content">
    <div class="admin-top-bar">
        <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="Global search for resources...">
        </div>
        <div class="top-actions">
            <button class="icon-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </button>
            <div class="divider"></div>
            <span class="date">{{ today | date:'mediumDate' }}</span>
        </div>
    </div>
    <div class="scroll-area">
        <ng-content></ng-content>
    </div>
</div>
